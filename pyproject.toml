[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-api-platform"
version = "0.1.0"
description = "A production-oriented API platform gateway"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.6,<3.0",
]

[project.optional-dependencies]
test = [
    "coverage[toml]>=7.6,<8.0",
    "httpx>=0.27,<1.0",
    "mypy>=1.14,<2.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]

[tool.coverage.run]
source = ["aegis"]
branch = false
relative_files = true
parallel = false

[tool.coverage.report]
fail_under = 85
precision = 2
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E",
    "F",
    "I",
    "PIE",
    "RUF",
    "SIM",
    "UP",
    "W",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src/aegis", "tests"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]
pretty = true
show_error_codes = true
show_column_numbers = true
warn_unused_configs = true
